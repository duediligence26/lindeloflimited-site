<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In the bin — Lindelof Limited</title>
  <meta name="description" content="A clip-bin prototype. The only navigation is a list of pieces. The pane on the right is the monitor.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bin.css">
  <link rel="icon" href="../../images/favicon.png">
</head>
<body>
  <div class="proto">
    <a href="../">All concepts</a>
    <span>Prototype · not the live site</span>
  </div>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span class="rec" aria-hidden="true"></span>
        <div>
          <img src="../../images/logo.png" alt="Lindelof Limited">
          <p>Clip bin · 8</p>
        </div>
      </div>
      <nav class="clips" aria-label="Clips" id="bin"></nav>
      <a class="mail" href="mailto:hello@lindeloflimited.com">hello@lindeloflimited.com</a>
    </aside>
    <main class="stage">
      <div class="monitor">
        <div class="hud"><span class="rec" aria-hidden="true"></span> <span id="hud">Clip 01</span></div>
        <img id="still" src="../../images/creative-connection-poster.jpg" alt="">
      </div>
      <div class="caption">
        <h1 id="title">Connection</h1>
        <p id="copy"></p>
        <div class="actions" id="actions"></div>
      </div>
    </main>
  </div>
  <script>
    const clips = [
      { id: "connection", n: "01", k: "Short · 2019", t: "Connection", img: "../../images/creative-connection-poster.jpg", alt: "Title card reading directed and written by Zachary Lindelof", d: "Directed, written, and edited by Zachary Lindelof. First-Time Filmmaking Sessions finalist.", open: "connection.html", openLabel: "Open this clip" },
      { id: "reels", n: "02", k: "Reels · 2020", t: "Four reels", img: "../../images/card-resume.jpg", alt: "Performer in front of a fireworks screen", d: "Directing, editing, screenwriting, and broadcast. The résumé next to them is dated 1.10.2026.", href: "https://www.youtube.com/watch?v=Spz2NvbfDxE", openLabel: "Play directing reel" },
      { id: "photopass", n: "03", k: "Day job", t: "PhotoPass", img: "../../images/disney-castle.jpg", alt: "Zachary Lindelof in front of Cinderella Castle", d: "Full-time Walt Disney World PhotoPass photographer since October 2022. College Program the year before. Capture Your Moment, castle trained, 500-plus sessions." },
      { id: "broadcast", n: "04", k: "Live · 2017–2021", t: "Bearkat", img: "../../images/card-broadcast.jpg", alt: "Basketball broadcast", d: "Technical director and video producer for ESPN3 and ESPN+. Tricaster and Ross, while he finished film school.", href: "https://www.youtube.com/watch?v=i1z5PHL91R4", openLabel: "Play a broadcast" },
      { id: "stills", n: "05", k: "Photography", t: "Stills", img: "../../images/photo-world-5.jpg", alt: "A still from the around-the-world gallery", d: "The non-Disney gallery: Walt Disney World frames he shot for himself, the road, and the cats. Not a PhotoPass order form." },
      { id: "pages", n: "06", k: "Writing", t: "Screenwriting", img: "../../images/card-screen.jpg", alt: "Title page of the screenplay Save the Day", d: "Save the Day (2018) and Death and Taxes (2026). Three more are in progress, including a feature documentary." },
      { id: "due", n: "07", k: "In progress", t: "Due Diligence", img: "../../images/due-preview.jpg", alt: "Due Diligence website preview", d: "A research studio. Reasonable steps, then the site.", href: "https://duediligence.fyi", openLabel: "Open duediligence.fyi" },
      { id: "twitch", n: "08", k: "Channel", t: "Lunchalof", img: "../../images/card-twitch.jpg", alt: "Lunchalof Games panels", d: "Twitch for games and charity, including Texas Children’s Hospital, plus highlight edits for other creators.", href: "https://www.twitch.tv/lunchalofgames", openLabel: "Open the channel" }
    ];
    const nav = document.getElementById("bin");
    const still = document.getElementById("still");
    const title = document.getElementById("title");
    const copy = document.getElementById("copy");
    const actions = document.getElementById("actions");
    const hud = document.getElementById("hud");
    function show(clip) {
      still.src = clip.img;
      still.alt = clip.alt;
      title.textContent = clip.t;
      copy.textContent = clip.d;
      hud.textContent = "Clip " + clip.n;
      actions.innerHTML = "";
      const href = clip.open || clip.href;
      if (href) {
        const a = document.createElement("a");
        a.className = "btn";
        a.href = href;
        a.textContent = clip.openLabel;
        if (clip.href) { a.target = "_blank"; a.rel = "noopener"; }
        actions.appendChild(a);
      }
      const mail = document.createElement("a");
      mail.className = "btn ghost";
      mail.href = "mailto:hello@lindeloflimited.com?subject=" + encodeURIComponent(clip.t);
      mail.textContent = "Email about this";
      actions.appendChild(mail);
      [...nav.children].forEach(function (b) {
        b.setAttribute("aria-pressed", b.dataset.id === clip.id ? "true" : "false");
      });
    }
    clips.forEach(function (clip) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.id = clip.id;
      b.innerHTML = clip.t + "<small>" + clip.k + "</small>";
      b.addEventListener("click", function () {
        show(clip);
        history.replaceState(null, "", "#" + clip.id);
      });
      nav.appendChild(b);
    });
    const start = clips.find(function (c) { return c.id === location.hash.slice(1); }) || clips[0];
    show(start);
  </script>
</body>
</html>
